[package]
name = "scout"
version = "0.0.1"
description = "Artifical Intellegence powered visual search for local image libraries."
authors = ["Jamster"]
edition = "2021"
 
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
 
[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "scout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
 
[build-dependencies]
tauri-build = { version = "2", features = [] }
 
[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
rayon = "1"
image = { version = "0.25", features = ["webp"] }
walkdir = "2"
jwalk = "0.8.1"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt", "macros"] } 
fast_image_resize = "6.0.0"
turbojpeg = { version = "1", features = ["image"] }
instant-clip-tokenizer = "0.1"
notify = "6"
notify-debouncer-mini = "0.4"
tauri-plugin-notification = "2"
bytemuck = "1.25.0"
kamadak-exif = "0.5"
 
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
ort = { version = "2.0.0-rc.12", features = ["download-binaries", "cuda"] }
 
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "2.0.0-rc.12", features = ["download-binaries", "coreml"] }
 
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Com"] }
 
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
split-debuginfo = "packed"
 
[profile.dev]
opt-level = 0
codegen-units = 256
debug = 0
strip = "debuginfo"
incremental = true
 